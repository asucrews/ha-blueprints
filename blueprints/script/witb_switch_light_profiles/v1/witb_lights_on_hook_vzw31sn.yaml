blueprint:
  name: 'WITB Lights ON Hook (Profile: VZW31-SN Switch + Bulb) v2.1.2'
  description: |
    Version: 2.1.2 — see CHANGELOG.md for full version history.

    Hook script called by WITB / WITB+ Actions to turn smart bulbs ON when they sit behind an
    Inovelli VZW31-SN Z-Wave dimmer running in Smart Bulb Mode (Parameter 52). The switch passes
    power through at all times so bulbs are controlled directly — this script handles everything
    that can go wrong when they aren't responding.

    Execution order:
    - Local protection: optionally sets the VZW31-SN local protection select to prevent the paddle from cutting power or changing level.
    - Z-Wave health check: if the dimmer is unreachable, pings it via the Z-Wave JS Ping button before proceeding. Notifies if ping fails.
    - Smart Bulb Mode reset: if any bulb is unavailable/unknown, power-cycles it by toggling Parameter 52 OFF then ON. Skips if bulbs recovered on their own (sbm_skip_if_recovered). Enforces a configurable cooldown between resets.
    - Idempotent SBM enable: optionally ensures Parameter 52 is set to enabled on every run. Skipped automatically when a reset was just performed.
    - Turn on available bulbs: sends light.turn_on with resolved brightness and transition to all reachable bulbs.
    - Brightness resolution: fixed mode uses the configured brightness %; day/night mode switches between day and night brightness based on time window or the is_night variable passed by WITB. Both values can be overridden by input_number helpers at runtime.
    - Verify and retry: re-sends the ON command to any bulb that didn't respond, up to verify_attempts times. Exits early when all confirm on.
    - Recheck loop: polls unavailable bulbs on a configurable interval for up to recheck_attempts cycles and turns them on as they come back. Exits early when all recover. Optionally limited to only run when bulbs are actually missing (recheck_only_if_any_missing).
    - Notifications: reports unavailable bulbs, Z-Wave issues, SBM cooldown skips, verify failures, and persistent missing bulbs. All three notification IDs (power, device, status) are dismissed automatically on a clean success.

    Runtime variables passed by WITB (lights is required, all others optional):
    - lights (list): entity IDs of bulbs to control.
    - brightness_pct (int 0-100): overrides blueprint brightness when provided.
    - transition (float, seconds): overrides blueprint transition when provided.
    - is_night (bool): overrides day/night time calculation when provided.
    - lux_value, lux_threshold (float): passed through for notification context.
    - reason (string): passed through for notification context.

    See CHANGELOG.md for full version history.
  domain: script
  source_url: https://github.com/asucrews/ha-blueprints/blob/main/blueprints/script/witb_switch_light_profiles/v2/witb_lights_on_hook_profile_vzw31_sn_switch_bulb_v2_1_1.yaml
  homeassistant:
    min_version: 2024.8.0
  input:
    core:
      name: Core
      icon: mdi:lightbulb
      input:
        vzw31_entity:
          name: VZW31-SN entity
          description: >
            Select an entity belonging to the VZW31-SN device (typically the dimmer light entity). Used as the
            target for zwave_js.set_config_parameter (Smart Bulb Mode toggle).
          selector:
            entity:
              integration: zwave_js
              multiple: false
        lights:
          name: Lights to control
          description: List of light entity_ids to turn on. (Passed by WITB+ Actions)
          selector:
            entity:
              domain: light
              multiple: true
          default: []
        transition:
          name: Transition (seconds)
          description: Transition time in seconds. Optional; defaults to 0.
          selector:
            number:
              min: 0
              max: 60
              mode: slider
              step: 0.5
          default: 0
    lighting:
      name: Brightness (inputs mode)
      icon: mdi:brightness-6
      input:
        brightness_mode:
          name: Brightness mode
          description: >
            'fixed' uses the Brightness (%) value below.
            'day_night' switches between day/night brightness based on time or is_night.
          default: fixed
          selector:
            select:
              mode: dropdown
              options:
                - label: Fixed brightness
                  value: fixed
                - label: Day/Night schedule
                  value: day_night
        brightness_pct:
          name: Brightness (%)
          description: Brightness percent (0-100). Optional; defaults to 100.
          selector:
            number:
              min: 0
              max: 100
              mode: slider
              step: 1
          default: 100
        brightness_day_pct:
          name: Brightness day (%)
          default: 100
          selector:
            number:
              min: 0
              max: 100
              mode: slider
              step: 1
          description: Used when Brightness mode = Day/Night schedule.
        brightness_night_pct:
          name: Brightness night (%)
          default: 10
          selector:
            number:
              min: 0
              max: 100
              mode: slider
              step: 1
          description: Used when Brightness mode = Day/Night schedule.
        brightness_day_helper:
          name: Brightness day helper (optional)
          default: ''
          selector:
            entity:
              domain: input_number
              multiple: false
          description: Optional input_number to override day brightness.
        brightness_night_helper:
          name: Brightness night helper (optional)
          default: ''
          selector:
            entity:
              domain: input_number
              multiple: false
          description: Optional input_number to override night brightness.
        night_start_time:
          name: Night start time
          default: '22:00:00'
          selector:
            time: {}
          description: Used when Brightness mode = Day/Night and no helper is provided.
        night_end_time:
          name: Night end time
          default: '06:00:00'
          selector:
            time: {}
          description: Used when Brightness mode = Day/Night and no helper is provided.
        night_start_helper:
          name: Night start helper (optional)
          default: ''
          selector:
            entity:
              domain: input_datetime
              multiple: false
          description: Optional input_datetime (time or datetime) for night start.
        night_end_helper:
          name: Night end helper (optional)
          default: ''
          selector:
            entity:
              domain: input_datetime
              multiple: false
          description: Optional input_datetime (time or datetime) for night end.
    sbm:
      name: Smart Bulb Mode
      icon: mdi:toggle-switch
      input:
        reset_power_if_unavailable:
          name: Reset power if bulbs unavailable
          description: If enabled, toggles Smart Bulb Mode OFF->ON when any bulb is unavailable/unknown.
          default: true
          selector:
            boolean: {}
        ensure_smart_bulb_mode_enabled:
          name: Ensure Smart Bulb Mode enabled
          description: If enabled, sets Smart Bulb Mode to enabled (idempotent).
          default: true
          selector:
            boolean: {}
        sbm_last_reset_helper:
          name: SBM last reset helper (input_datetime or timestamp sensor, optional)
          description: >
            Optional entity that stores the last time this script performed an SBM reset.
            - If it's an input_datetime.* entity, this script will write to it directly.
            - Otherwise (e.g., a template timestamp sensor), this script will fire an event
              so a template blueprint can update it.
            When provided, sbm_reset_cooldown_s will be enforced.
          default: ''
          selector:
            entity: {}
        sbm_reset_event_type:
          name: SBM reset event type (for template tracker)
          description: >
            Event type fired by this script whenever it performs an SBM reset. Use the same event type in the
            template tracker blueprint.
          default: witb_switch_light_profile_sbm_reset
          selector:
            text: {}
        sbm_reset_cooldown_s:
          name: SBM reset cooldown (seconds)
          description: Minimum time between SBM resets (only enforced when sbm_last_reset_helper is set).
          default: 600
          selector:
            number:
              min: 0
              max: 7200
              mode: slider
              step: 30
              unit_of_measurement: s
        smart_bulb_mode_param:
          name: Smart Bulb Mode parameter number
          description: Inovelli Smart Bulb Mode is typically Parameter 52.
          default: 52
          selector:
            number:
              min: 1
              max: 255
              mode: box
              step: 1
        smart_bulb_mode_disabled_value:
          name: Smart Bulb Mode disabled value
          description: Usually 0.
          default: 0
          selector:
            number:
              min: 0
              max: 255
              mode: box
              step: 1
        smart_bulb_mode_enabled_value:
          name: Smart Bulb Mode enabled value
          description: Usually 1.
          default: 1
          selector:
            number:
              min: 0
              max: 255
              mode: box
              step: 1
        sbm_toggle_delay_ms:
          name: Smart Bulb Mode toggle delay (ms)
          description: Delay between disabling and enabling Smart Bulb Mode.
          default: 300
          selector:
            number:
              min: 0
              max: 5000
              mode: slider
              step: 50
              unit_of_measurement: ms
        sbm_reset_cooldown_helper:
          name: SBM reset cooldown helper (optional)
          default: ''
          selector:
            entity:
              domain: input_number
              multiple: false
          description: Optional input_number (seconds) to override sbm_reset_cooldown_s.
        sbm_skip_if_recovered:
          name: 'SBM reset: skip if recovered'
          default: true
          selector:
            boolean: {}
          description: Skip SBM reset if bulbs recovered by the time we would reset.
        sbm_force_output_on_during_toggle:
          name: 'SBM reset: force output ON during toggle'
          default: true
          selector:
            boolean: {}
          description: Force switch output ON before/after SBM toggle.
    reliability:
      name: Reliability
      icon: mdi:shield-check
      collapsed: true
      input:
        vzw31_node_status:
          name: VZW31 node status sensor (optional)
          description: >
            Optional: The Z-Wave JS "Node status" sensor for this device (often disabled by default). When provided,
            we'll treat state "dead" as not reachable.
          default: ''
          selector:
            entity:
              domain: sensor
              integration: zwave_js
              multiple: false
        vzw31_ping_button:
          name: VZW31 ping button (optional)
          description: >
            Optional: The Z-Wave JS "Ping" button entity for this device. This is the modern replacement for the
            deprecated zwave_js.ping service.
          default: ''
          selector:
            entity:
              domain: button
              integration: zwave_js
              multiple: false
        ping_attempts:
          name: Ping attempts
          description: How many times to press the ping button (harmless if already reachable).
          default: 2
          selector:
            number:
              min: 0
              max: 10
              mode: slider
              step: 1
        ping_timeout_s:
          name: Ping wait timeout (seconds)
          description: How long to wait after each ping for the device to become reachable.
          default: 8
          selector:
            number:
              min: 1
              max: 60
              mode: slider
              step: 1
              unit_of_measurement: s
        ping_retry_delay_s:
          name: Delay between pings (seconds)
          description: Pause between ping attempts.
          default: 1
          selector:
            number:
              min: 0
              max: 10
              mode: slider
              step: 1
              unit_of_measurement: s
        power_on_delay_ms:
          name: Post-toggle delay (ms)
          description: Delay after toggling Smart Bulb Mode before checking bulbs / turning on lights.
          default: 250