blueprint:
  name: Smart Vents - Flair (1.1.0)
  homeassistant:
    min_version: 2026.3.0
  description: |
    Version: 1.1.0 — see CHANGELOG_flair.md for full version history.

    Flair smart vent controller for a single room. Translates the WITB+
    occupied_effective occupancy signal into Flair activity status commands.

    OCCUPANCY → VENT CONTROL
      • occupied_effective ON  → Flair activity status Active + clear hold.
      • occupied_effective OFF → Flair activity status Inactive + clear hold,
        after the room has stayed vacant for inactive_delay_minutes (default 0 =
        immediately). Returning inside the delay cancels it and the room stays
        Active.
      All occupancy debounce and exit evaluation is handled upstream by the
      WITB+ occupancy blueprint. Do not wire a raw door/motion sensor or the
      input_boolean occupancy helper here.

    RECONCILIATION
      • If flair_activity_status changes for any reason and does not match
        occupied_effective, it is corrected after reconciliation_delay seconds.
      • Active while the room is vacant is correct until occupied_effective has
        been off for inactive_delay_minutes; it is only corrected to Inactive after that.
      • Pre-delay mismatch check prevents unnecessary reconciliation cycles when
        this automation's own service calls trigger the reconciliation path.
      • unknown/unavailable transitions on HA restart are suppressed and do not
        trigger reconciliation.

    CONSISTENCY SWEEP
      • Once a minute, if occupied_effective and the Flair status are out of
        step (occupied but not Active, or vacant for at least inactive_delay_minutes
        but not Inactive; both entities known), the status is corrected. If
        they agree, no run starts. Recovers from a lost vacancy timer, a
        cancelled startup sync or Flair restoring from unavailable.

    STARTUP SYNC
      • On HA restart, waits 30 s for WITB+ and the Flair integration to restore,
        then reconciles vent state against current occupied_effective. Recovers
        from drift that occurred while HA was offline. Ignores inactive_delay_minutes
        (vacant = Inactive), because the vacancy timer does not survive a restart.

    REQUIRED ENTITIES (one set per room)
      • binary_sensor — room_slug_occupied_effective  (WITB+ output)
      • select        — Flair activity status
      • button        — Flair clear hold

  domain: automation
  source_url: https://github.com/asucrews/ha-blueprints/blob/main/blueprints/automation/flair/v1/flair.yaml
  author: Jeremy Crews
  input:
    required_entities:
      name: Required Entities
      icon: mdi:valve
      description: Required entities for this automation.
      collapsed: false
      input:
        occupied_effective:
          name: WITB+ Occupied Effective
          description: >
            The room's WITB+ effective occupancy sensor
            (binary_sensor.room_slug_occupied_effective).
            This is the single source of truth for room occupancy. Do not use
            the raw input_boolean.room_slug_occupied helper or a door/motion
            sensor directly — those are evaluated upstream by WITB+.
          selector:
            entity:
              domain:
                - binary_sensor
              multiple: false
        flair_activity_status:
          name: Flair Activity Status
          description: >
            The Flair activity status select entity for this room. Set to
            Active when occupied and Inactive when unoccupied.
          selector:
            entity:
              domain:
                - select
              multiple: false
        flair_clear_hold:
          name: Flair Clear Hold Button
          description: >
            The Flair clear hold button entity for this room. Pressed after
            every activity status change to ensure the new state takes effect
            immediately.
          selector:
            entity:
              domain:
                - button
              multiple: false
    optional_settings:
      name: Optional Settings
      icon: mdi:tune
      description: Optional configuration for vacancy delay and reconciliation behavior.
      collapsed: true
      input:
        inactive_delay_minutes:
          name: Inactive Delay
          description: >
            How long, in whole minutes, the room must be vacant
            (occupied_effective off) before Flair is set Inactive. If the room
            is occupied again within the delay, Flair stays Active. Set to 0
            for immediate (the 1.0.5 behavior).
          default: 0
          selector:
            number:
              mode: box
              min: 0
              max: 60
              step: 1
              unit_of_measurement: minutes
        reconciliation_delay:
          name: Flair Status Reconciliation Delay
          description: >
            How long to wait, in seconds, before correcting a Flair activity
            status that does not match the current occupancy state. A short
            delay prevents the automation from fighting intentional manual
            changes or brief Flair cloud state transitions before they settle.
            Set to 0 to correct immediately.
          default: 5
          selector:
            number:
              mode: box
              min: 0
              max: 60
              step: 1
              unit_of_measurement: seconds

variables:
  inactive_delay_minutes_cfg: !input inactive_delay_minutes
  inactive_delay_is_zero: "{{ (inactive_delay_minutes_cfg | float(0)) == 0 }}"
  occ_entity: !input occupied_effective
  status_entity: !input flair_activity_status

triggers:
  - trigger: state
    entity_id: !input occupied_effective
    from: "off"
    to: "on"
    id: Room Occupied
  - trigger: state
    entity_id: !input occupied_effective
    from:
      - "on"
      - unavailable
      - unknown
    to: "off"
    for:
      minutes: !input inactive_delay_minutes
    id: Room Unoccupied
  - trigger: state
    entity_id: !input flair_activity_status
    not_from:
      - unknown
      - unavailable
    not_to:
      - unknown
      - unavailable
    id: Flair Status Changed
  - trigger: homeassistant
    event: start
    id: HA Started
  - trigger: time_pattern
    minutes: "/1"
    id: Consistency Sweep

conditions:
  # Conditions are checked before a run starts, so a rejected trigger never
  # cancels a run already in progress under mode: restart.
  # Room Unoccupied: at delay 0, an unavailable/unknown -> off must not start a
  # run; it would cancel the 30 s startup sync while Flair is still unavailable.
  # Consistency Sweep: once a minute, passes only if the room is out of step
  # (both entities known, occupied but not Active, or vacant for at least the
  # delay but not Inactive). Catches a lost vacancy timer, a cancelled startup
  # sync or Flair restoring from unavailable. Inside the delay, either status
  # is accepted. All other triggers pass.
  - condition: template
    value_template: >-
      {%- if trigger.id == 'Room Unoccupied' -%}
        {{ not (inactive_delay_is_zero
                and trigger.from_state is not none
                and trigger.from_state.state in ['unavailable', 'unknown']) }}
      {%- elif trigger.id == 'Consistency Sweep' -%}
        {%- set occ = states(occ_entity) -%}
        {%- set sta = states(status_entity) -%}
        {%- set occ_obj = expand(occ_entity) | first | default(none) -%}
        {{ (occ == 'on' and sta == 'Inactive')
           or (occ == 'off' and sta == 'Active'
               and (inactive_delay_is_zero
                    or (occ_obj is not none
                        and (now() - occ_obj.last_changed).total_seconds()
                            >= (inactive_delay_minutes_cfg | float(0)) * 60))) }}
      {%- else -%}
        true
      {%- endif -%}

actions:
  - choose:
      # ==========================================================================
      # OCCUPIED → ACTIVE
      # ==========================================================================
      - conditions:
          - condition: trigger
            id:
              - Room Occupied
        sequence:
          - action: select.select_option
            data:
              option: Active
            target:
              entity_id: !input flair_activity_status
          - action: button.press
            data: {}
            target:
              entity_id: !input flair_clear_hold

      # ==========================================================================
      # UNOCCUPIED → INACTIVE
      # ==========================================================================
      - conditions:
          - condition: trigger
            id:
              - Room Unoccupied
        sequence:
          - action: select.select_option
            data:
              option: Inactive
            target:
              entity_id: !input flair_activity_status
          - action: button.press
            data: {}
            target:
              entity_id: !input flair_clear_hold

      # ==========================================================================
      # FLAIR STATUS CHANGED → RECONCILE
      # Pre-delay mismatch check gates entry: if flair_activity_status already
      # matches occupied_effective (e.g. our own service call just set it), this
      # branch exits immediately — no delay, no unnecessary restart cycle.
      # Vacant side: Active is only a mismatch once occupied_effective has been
      # off for inactive_delay_minutes; before that the Room Unoccupied trigger owns it.
      # ==========================================================================
      - conditions:
          - condition: trigger
            id:
              - Flair Status Changed
          - condition: or
            conditions:
              - condition: and
                conditions:
                  - condition: state
                    entity_id: !input occupied_effective
                    state: "on"
                  - condition: not
                    conditions:
                      - condition: state
                        entity_id: !input flair_activity_status
                        state: "Active"
              - condition: and
                conditions:
                  # Vacant long enough. A zero for: is not the same as no for: (HA tests
                  # strictly greater-than), so at delay 0 the age test is skipped.
                  - condition: state
                    entity_id: !input occupied_effective
                    state: "off"
                  - condition: or
                    conditions:
                      - condition: template
                        value_template: "{{ inactive_delay_is_zero }}"
                      - condition: state
                        entity_id: !input occupied_effective
                        state: "off"
                        for:
                          minutes: !input inactive_delay_minutes
                  - condition: not
                    conditions:
                      - condition: state
                        entity_id: !input flair_activity_status
                        state: "Inactive"
        sequence:
          - delay:
              seconds: !input reconciliation_delay
          - choose:
              - conditions:
                  - condition: state
                    entity_id: !input occupied_effective
                    state: "on"
                  - condition: not
                    conditions:
                      - condition: state
                        entity_id: !input flair_activity_status
                        state: "Active"
                sequence:
                  - action: select.select_option
                    data:
                      option: Active
                    target:
                      entity_id: !input flair_activity_status
                  - action: button.press
                    data: {}
                    target:
                      entity_id: !input flair_clear_hold
              - conditions:
                  # Vacant long enough. A zero for: is not the same as no for: (HA tests
                  # strictly greater-than), so at delay 0 the age test is skipped.
                  - condition: state
                    entity_id: !input occupied_effective
                    state: "off"
                  - condition: or
                    conditions:
                      - condition: template
                        value_template: "{{ inactive_delay_is_zero }}"
                      - condition: state
                        entity_id: !input occupied_effective
                        state: "off"
                        for:
                          minutes: !input inactive_delay_minutes
                  - condition: not
                    conditions:
                      - condition: state
                        entity_id: !input flair_activity_status
                        state: "Inactive"
                sequence:
                  - action: select.select_option
                    data:
                      option: Inactive
                    target:
                      entity_id: !input flair_activity_status
                  - action: button.press
                    data: {}
                    target:
                      entity_id: !input flair_clear_hold

      # ==========================================================================
      # CONSISTENCY SWEEP
      # The top-level condition already established a mismatch between
      # occupied_effective and the Flair status, so act directly.
      # ==========================================================================
      - conditions:
          - condition: trigger
            id:
              - Consistency Sweep
        sequence:
          - action: select.select_option
            data:
              option: "{{ 'Active' if is_state(occ_entity, 'on') else 'Inactive' }}"
            target:
              entity_id: !input flair_activity_status
          - action: button.press
            data: {}
            target:
              entity_id: !input flair_clear_hold

      # ==========================================================================
      # HA RESTART → STARTUP SYNC
      # Waits 30 s for WITB+ and the Flair integration to restore before
      # reconciling. Blocking delay acceptable here — fires once per HA restart.
      # ==========================================================================
      - conditions:
          - condition: trigger
            id:
              - HA Started
        sequence:
          - delay:
              seconds: 30
          - choose:
              - conditions:
                  - condition: state
                    entity_id: !input occupied_effective
                    state: "on"
                  - condition: not
                    conditions:
                      - condition: state
                        entity_id: !input flair_activity_status
                        state: "Active"
                sequence:
                  - action: select.select_option
                    data:
                      option: Active
                    target:
                      entity_id: !input flair_activity_status
                  - action: button.press
                    data: {}
                    target:
                      entity_id: !input flair_clear_hold
              - conditions:
                  - condition: state
                    entity_id: !input occupied_effective
                    state: "off"
                  - condition: not
                    conditions:
                      - condition: state
                        entity_id: !input flair_activity_status
                        state: "Inactive"
                sequence:
                  - action: select.select_option
                    data:
                      option: Inactive
                    target:
                      entity_id: !input flair_activity_status
                  - action: button.press
                    data: {}
                    target:
                      entity_id: !input flair_clear_hold

mode: restart
